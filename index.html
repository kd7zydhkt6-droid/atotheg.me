<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Aaron G.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 300;
      font-size: 16px;
      line-height: 1.7;
      color: #111;
      background: #fff;
      max-width: 560px;
      margin: 0;                 /* left-aligned to the page, not centered */
      padding: 80px 24px 120px 64px;
    }

    h1 {
      font-size: 16px;
      font-weight: 400;
      margin-bottom: 40px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      margin-bottom: 12px;
    }

    /* Inactive sections: plain text, not clickable. */
    .pending {
      color: #999;
    }

    /* Active sections: swap the <span> for an <a> and it picks this up. */
    a {
      color: #111;
      text-decoration: underline;
      text-decoration-color: #bbb;
      text-underline-offset: 3px;
      transition: text-decoration-color 0.15s;
    }
    a:hover { text-decoration-color: #111; }

    .contact {
      margin-top: 56px;
      padding-top: 28px;
      border-top: 1px solid #e8e8e8;
      font-size: 14px;
    }
    .contact a { color: #999; text-decoration: none; }
    .contact a:hover { color: #111; }

    @media (max-width: 600px) {
      body { padding: 56px 24px 80px 24px; }
    }
  </style>
</head>
<body>

  <h1>Aaron G.</h1>

  <ul>
    <!-- To activate a section, replace its line with the commented version below it. -->

    <li><span class="pending">About</span></li>
    <!-- <li><a href="/about">About</a></li> -->

    <li><span class="pending">Bookshelf</span></li>
    <!-- <li><a href="/bookshelf">Bookshelf</a></li> -->

    <li><span class="pending">Interests</span></li>
    <!-- <li><a href="/interests">Interests</a></li> -->

    <li><span class="pending">Pictures</span></li>
    <!-- <li><a href="/pictures">Pictures</a></li> -->

    <li><span class="pending">Things I think I think</span></li>
    <!-- <li><a href="/thoughts">Things I think I think</a></li> -->

    <li><span class="pending">Words</span></li>
    <!-- <li><a href="/words">Words</a></li> -->
  </ul>

  <p class="contact">
    <a href="mailto:howdy@atotheg.me">howdy@atotheg.me</a>
  </p>

</body>
</html>
