<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Aaron G.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 300;
      font-size: 16px;
      line-height: 1.75;
      color: #111;
      background: #fff;
      max-width: 620px;
      margin: 0;                 /* left-aligned to the page, not centered */
      padding: 80px 24px 120px 64px;
    }

    h1 {
      font-size: 16px;
      font-weight: 400;
      margin-bottom: 36px;
    }

    p {
      color: #333;
      margin-bottom: 18px;
      max-width: 56ch;
    }

    a {
      color: #111;
      text-decoration: underline;
      text-decoration-color: #bbb;
      text-underline-offset: 3px;
      transition: text-decoration-color 0.15s;
    }
    a:hover { text-decoration-color: #111; }

    /* ---------- photos ---------- */
    .photos {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 36px 0;
      max-width: 520px;
    }
    .photos img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
      border-radius: 2px;
    }
    /* ---------- interests ---------- */
    .label {
      font-size: 14px;
      color: #999;
      margin-bottom: 10px;
    }
    ul {
      list-style: none;
      padding: 0;
    }
    ul li {
      position: relative;
      padding-left: 16px;
      margin-bottom: 7px;
      color: #333;
    }
    ul li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 13px;
      width: 5px;
      height: 1px;
      background: #bbb;
    }

    .contact {
      margin-top: 48px;
      padding-top: 26px;
      border-top: 1px solid #e8e8e8;
      font-size: 14px;
    }
    .contact a { color: #999; text-decoration: none; }
    .contact a:hover { color: #111; }

    @media (max-width: 600px) {
      body { padding: 56px 24px 80px 24px; }
      .photos { gap: 8px; }
    }
  </style>
</head>
<body>

  <h1>Aaron G.</h1>

  <p>
    PNW-based militantly optimistic bloke. Traveler, hiker, cyclist, camper, reader,
    and subpar pickleball player often found with coffee.
  </p>

  <div class="photos">
    <img src="photo-1.jpg" alt="Standing on a rock above a glacial lake, looking toward the Fitz Roy massif in Patagonia">
    <img src="photo-2.jpg" alt="Sitting with my dog on the rim of Crater Lake at sunset">
  </div>

  <p class="label">Current interests</p>
  <ul>
    <li>Woodworking</li>
    <li>Aprendiendo Espa&ntilde;ol</li>
    <li>Jon Ronson's works</li>
    <li>Trails in the Eastern Sierras</li>
  </ul>

  <p class="contact">
    <a href="mailto:howdy@atotheg.me">howdy@atotheg.me</a>
  </p>

</body>
</html>
